name: AnyTravel
options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: zh-Hans
  xcodeVersion: "2700"
  projectFormat: xcode16_3
  groupSortPosition: top
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
targets:
  AnyTravel:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/AnyTravel.xcconfig
      Release: Config/AnyTravel.xcconfig
    sources:
      - path: AnyTravel
        excludes:
          - Resources
      - path: AnyTravel/Resources
        excludes:
          - Info.plist
        buildPhase: resources
    info:
      path: AnyTravel/Resources/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        AnyTravelRollingGoAPIKey: "$(ANYTRAVEL_ROLLINGGO_API_KEY)"
        AnyTravelAMapWebServiceKey: "$(ANYTRAVEL_AMAP_WEB_SERVICE_KEY)"
        AnyTravelZAIAPIKey: "$(ANYTRAVEL_ZAI_API_KEY)"
        LSRequiresIPhoneOS: true
        NSLocationWhenInUseUsageDescription: 用于把地图移动到你当前的位置，方便规划从身边出发的路线。
        NSLocalNetworkUsageDescription: 用于连接你自行运行的 AnyTravel 开源报价节点，获取住宿与交通比价结果。
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UILaunchStoryboardName: LaunchScreen
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anytravel.app
        PRODUCT_NAME: AnyTravel
        MARKETING_VERSION: 0.8.0
        CURRENT_PROJECT_VERSION: 15
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: YES
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
  AnyTravelTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AnyTravelTests
    dependencies:
      - target: AnyTravel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anytravel.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/AnyTravel.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/AnyTravel"
        BUNDLE_LOADER: "$(TEST_HOST)"
  AnyTravelUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: AnyTravelUITests
    dependencies:
      - target: AnyTravel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anytravel.uitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
schemes:
  AnyTravel:
    build:
      targets:
        AnyTravel: all
        AnyTravelTests: [test]
        AnyTravelUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - name: AnyTravelTests
        - name: AnyTravelUITests
    archive:
      config: Release
